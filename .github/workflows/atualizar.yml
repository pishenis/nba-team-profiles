name: Atualização diária

on:
  # schedules removidos em 2026-08-27 — substituídos pelo cron do servidor:
  #   diario:  cron_stats.sh diario  (11:00 UTC)
  #   jogos:   cron_stats.sh jogos   (a cada 15min entre 0-4h UTC, horário de jogos)
  # Manter workflow_dispatch como plano B manual.
  workflow_dispatch:

jobs:
  atualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install requests python-dotenv

      - name: Rodar scripts de coleta
        env:
          BDL_API_KEY: ${{ secrets.BDL_API_KEY }}
        run: |
          # Playoffs 2025-26 encerrados — reativar em abril de 2027
          # python3 coletar_playoffs.py
          # python3 coletar_head2head.py
          python3 coletar_todos_jogos.py
          python3 corrigir_starter.py

      - name: Commit e push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "Atualização $(date '+%Y-%m-%d %H:%M')"
          git push
