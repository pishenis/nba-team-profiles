name: Atualização diária

on:
  schedule:
    - cron: '0 11 * * *'       # 8h Brasília — coleta completa diária
    - cron: '*/15 0-4 * * *'   # A cada 15min entre 21h-1h Brasília (jogos das Finais)
  workflow_dispatch:

jobs:
  atualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install requests python-dotenv

      - name: Rodar scripts de coleta
        env:
          BDL_API_KEY: ${{ secrets.BDL_API_KEY }}
        run: |
          python3 coletar_playoffs.py
          python3 coletar_head2head.py
          python3 coletar_todos_jogos.py
          python3 corrigir_starter.py

      - name: Commit e push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "Atualização $(date '+%Y-%m-%d %H:%M')"
          git push
