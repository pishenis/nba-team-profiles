name: Atualização Free Agents

on:
  # schedule pausado em 2026-08-27 — bug em investigação no pipeline Python.
  # Substituído pelo cron do servidor (cron_stats.sh free-agents).
  # Reativar só se o cron do servidor for desativado (emergência).
  # schedule:
  #   - cron: '*/30 * * * *'   # a cada 30 minutos
  workflow_dispatch:

jobs:
  atualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install requests python-dotenv

      - name: Rodar pipeline de free agents
        env:
          BDL_API_KEY: ${{ secrets.BDL_API_KEY }}
        run: bash atualizar_free_agents.sh

      - name: Commit e push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/free-agents/
          git diff --staged --quiet || git commit -m "Atualização free agents $(date -u '+%Y-%m-%d %H:%M') UTC"
          git push
