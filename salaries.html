<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" type="image/jpeg" href="logo_bolapresa.jpg" />
<title>Salários NBA · Bola Presa</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;0,6..72,700;1,6..72,500&family=Inter+Tight:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
:root {
  --bp-blue:      #14a6b8;
  --bp-blue-dark: #0e8a99;
  --bp-blue-tint: #eaf8fa;
  --ink:          #1d1d1f;
  --ink-2:        #2b2a27;
  --mute:         #86868b;
  --mute-2:       #b8b5ad;
  --hair:         #e5e5ea;
  --paper:        #f9f9f9;
  --white:        #ffffff;
  --green:        #1D9E75;
  --red:          #D85A30;
  --serif: "Newsreader", Georgia, serif;
  --sans:  "Inter Tight", -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
  --mono:  "JetBrains Mono", ui-monospace, monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--white);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;min-height:100vh}
a{text-decoration:none;color:inherit}
button{cursor:pointer;border:none;background:none;font:inherit;color:inherit}

/* HEADER */
.site-header{display:flex;align-items:center;gap:10px;padding:0 32px;height:52px;border-bottom:0.5px solid var(--hair);background:var(--white);position:sticky;top:0;z-index:50}
.header-logo{font-family:var(--sans);font-weight:600;font-size:14px;color:var(--ink);display:flex;align-items:center;gap:7px}
.header-logo img{width:22px;height:22px;border-radius:4px;object-fit:cover}
.header-divider{width:0.5px;height:16px;background:var(--hair)}
.header-section{font-family:var(--mono);font-size:11px;font-weight:500;color:var(--mute);letter-spacing:0.05em;text-transform:uppercase}
.header-badge{font-family:var(--mono);font-size:10px;font-weight:500;color:var(--bp-blue);background:var(--bp-blue-tint);padding:3px 9px;border-radius:20px;letter-spacing:0.04em}
.site-nav{display:flex;align-items:center;gap:2px;margin-left:auto}
.nav-lnk{font-size:13px;color:var(--mute);padding:5px 10px;border-radius:6px;transition:background 0.15s,color 0.15s}
.nav-lnk:hover{background:var(--paper);color:var(--ink)}

/* WRAP */
.wrap{max-width:980px;margin:0 auto;padding:0 24px 80px}

/* HERO */
.hero{padding:40px 0 28px;border-bottom:0.5px solid var(--hair);margin-bottom:28px}
.hero h1{font-family:var(--serif);font-size:32px;font-weight:700;line-height:1.2;color:var(--ink);margin-bottom:6px}
.hero h1 em{font-style:italic;color:var(--bp-blue)}
.hero p{font-size:13px;color:var(--mute);line-height:1.5}
.hero-meta{display:flex;align-items:center;gap:12px;margin-top:14px;flex-wrap:wrap}
.meta-pill{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10px;font-weight:500;color:var(--mute);background:var(--paper);border:0.5px solid var(--hair);border-radius:20px;padding:4px 10px;letter-spacing:0.05em;text-transform:uppercase}
.meta-pill.blue{color:var(--bp-blue);background:var(--bp-blue-tint);border-color:transparent}

/* CONTROLES */
.controls{display:flex;align-items:center;gap:10px;margin-bottom:20px;flex-wrap:wrap}
.search-wrap{position:relative;flex:1;min-width:180px;max-width:320px}
.search-wrap svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--mute-2);pointer-events:none}
.search-input{width:100%;background:var(--white);border:0.5px solid var(--hair);border-radius:8px;color:var(--ink);padding:8px 10px 8px 32px;font-family:var(--sans);font-size:13px;outline:none;transition:border-color 0.15s,box-shadow 0.15s}
.search-input:focus{border-color:var(--bp-blue);box-shadow:0 0 0 3px var(--bp-blue-tint)}
.search-input::placeholder{color:var(--mute-2)}
.filter-group{display:flex;gap:4px}
.filter-btn{font-family:var(--mono);font-size:10px;font-weight:500;letter-spacing:0.05em;text-transform:uppercase;padding:6px 12px;border-radius:6px;border:0.5px solid var(--hair);background:var(--white);color:var(--mute);transition:all 0.12s}
.filter-btn:hover{border-color:var(--bp-blue);color:var(--bp-blue)}
.filter-btn.active{background:var(--bp-blue);color:#fff;border-color:var(--bp-blue)}
.sort-select{font-family:var(--mono);font-size:10px;letter-spacing:0.04em;text-transform:uppercase;background:var(--white);border:0.5px solid var(--hair);border-radius:6px;color:var(--mute);padding:6px 10px;outline:none;cursor:pointer;margin-left:auto}

/* GRID DE TIMES */
.teams-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.team-card{background:var(--white);border:0.5px solid var(--hair);border-radius:10px;padding:16px;cursor:pointer;transition:border-color 0.15s,box-shadow 0.12s}
.team-card:hover{border-color:var(--bp-blue);box-shadow:0 2px 10px rgba(20,166,184,0.08)}
.team-card-top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.team-logo{width:44px;height:44px;object-fit:contain;flex-shrink:0}
.team-card-name{font-size:14px;font-weight:600;line-height:1.2;color:var(--ink)}
.team-card-conf{font-family:var(--mono);font-size:10px;color:var(--mute);letter-spacing:0.05em;text-transform:uppercase;margin-top:2px}
.team-stats-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.ts-cell .ts-label{font-family:var(--mono);font-size:9px;color:var(--mute-2);letter-spacing:0.08em;text-transform:uppercase}
.ts-cell .ts-value{font-family:var(--mono);font-size:14px;font-weight:500;color:var(--ink);margin-top:2px}
.ts-cell .ts-value.blue{color:var(--bp-blue)}
.ts-cell .ts-value.red{color:var(--red)}
.cap-bar-wrap{margin-top:2px}
.cap-bar-labels{display:flex;justify-content:space-between;font-family:var(--mono);font-size:9px;color:var(--mute-2);margin-bottom:4px}
.cap-bar{height:3px;background:var(--hair);border-radius:2px;overflow:hidden}
.cap-bar-fill{height:100%;border-radius:2px;background:var(--bp-blue);transition:width 0.5s ease}
.cap-bar-fill.over{background:var(--red)}

/* DETALHE DO TIME */
#view-detail{display:none}
#view-detail.visible{display:block;animation:fadeUp 0.2s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.back-btn{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:11px;font-weight:500;color:var(--mute);letter-spacing:0.04em;text-transform:uppercase;padding:8px 0;margin-bottom:20px;transition:color 0.15s}
.back-btn:hover{color:var(--bp-blue)}
.detail-hero{display:flex;align-items:flex-end;gap:18px;padding-bottom:20px;border-bottom:0.5px solid var(--hair);margin-bottom:20px;flex-wrap:wrap}
.detail-logo{width:64px;height:64px;object-fit:contain;flex-shrink:0}
.detail-team-name{font-family:var(--serif);font-size:28px;font-weight:700;line-height:1.1;color:var(--ink)}
.detail-sub{font-family:var(--mono);font-size:10px;color:var(--mute);letter-spacing:0.05em;text-transform:uppercase;margin-top:4px}
.detail-kpis{display:flex;gap:28px;margin-left:auto;flex-wrap:wrap}
.kpi-label{font-family:var(--mono);font-size:9px;color:var(--mute-2);letter-spacing:0.08em;text-transform:uppercase}
.kpi-value{font-family:var(--mono);font-size:20px;font-weight:500;color:var(--bp-blue);margin-top:2px}
.kpi-value.neutral{color:var(--ink)}
.kpi-value.red{color:var(--red)}

/* TABELA */
.sec-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.sec-line{width:3px;height:14px;border-radius:2px;background:var(--bp-blue);flex-shrink:0}
.sec-name{font-size:13px;font-weight:500;color:var(--ink)}
.tbl-wrap{overflow-x:auto;border:0.5px solid var(--hair);border-radius:10px}
table{width:100%;border-collapse:collapse;font-size:12px}
thead{background:var(--paper)}
thead th{padding:9px 12px;text-align:left;font-family:var(--mono);font-size:9px;font-weight:500;letter-spacing:0.08em;text-transform:uppercase;color:var(--mute);white-space:nowrap;border-bottom:0.5px solid var(--hair)}
thead th.r{text-align:right}
tbody tr{border-bottom:0.5px solid var(--hair);transition:background 0.1s}
tbody tr:last-child{border-bottom:none}
tbody tr:hover{background:var(--paper)}
td{padding:10px 12px;vertical-align:middle;white-space:nowrap}
td.r{text-align:right}

/* células */
.player-cell{display:flex;align-items:center;gap:9px}
.player-photo{width:32px;height:32px;border-radius:50%;object-fit:cover;background:var(--hair);flex-shrink:0}
.player-name{font-size:13px;font-weight:500;color:var(--ink)}
.player-pos{font-family:var(--mono);font-size:9px;color:var(--mute);letter-spacing:0.05em;text-transform:uppercase;margin-top:1px}
.jersey-num{font-family:var(--mono);font-size:11px;color:var(--mute-2);width:24px;text-align:center}
.sal-val{font-family:var(--mono);font-size:12px;font-weight:500;color:var(--ink)}
.sal-val.top{color:var(--bp-blue)}
.sal-val.dim{color:var(--mute);font-weight:400}
.badge{display:inline-block;padding:2px 8px;border-radius:4px;font-family:var(--mono);font-size:9px;font-weight:500;letter-spacing:0.04em;white-space:nowrap}
.badge-rookie    {background:rgba(20,166,184,0.1);color:#0e8a99}
.badge-free      {background:rgba(29,158,117,0.1);color:#1D9E75}
.badge-extension {background:rgba(90,45,129,0.1);color:#5A2D81}
.badge-minimum   {background:var(--paper);color:var(--mute);border:0.5px solid var(--hair)}
.badge-twoway    {background:rgba(216,90,48,0.08);color:var(--red)}
.badge-other     {background:var(--paper);color:var(--mute);border:0.5px solid var(--hair)}
.signed-text{font-size:11px;color:var(--mute)}
.fa-ufa{font-family:var(--mono);font-size:10px;font-weight:500;color:var(--red)}
.fa-rfa{font-family:var(--mono);font-size:10px;font-weight:500;color:var(--bp-blue)}
.totals-row td{border-top:0.5px solid var(--hair);background:var(--paper);font-family:var(--mono);font-size:11px;font-weight:500;color:var(--mute)}
.totals-row .total-cap{color:var(--bp-blue);font-size:13px}
.cap-legend{margin-top:12px;display:flex;gap:16px;flex-wrap:wrap;font-family:var(--mono);font-size:10px;color:var(--mute)}
.cap-legend span{display:flex;align-items:center;gap:5px}
.dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}

/* loading/empty */
.loading{text-align:center;padding:48px 20px;color:var(--mute);font-size:13px}
.loading-dots{display:inline-flex;gap:5px;margin-bottom:10px}
.ld{width:6px;height:6px;background:var(--bp-blue);border-radius:50%;animation:ldpulse 1.2s ease-in-out infinite}
.ld:nth-child(2){animation-delay:0.2s}
.ld:nth-child(3){animation-delay:0.4s}
@keyframes ldpulse{0%,80%,100%{opacity:0.2;transform:scale(0.8)}40%{opacity:1;transform:scale(1)}}
.empty{text-align:center;padding:40px 20px;color:var(--mute);font-size:13px}
.footer-note{margin-top:32px;padding-top:12px;border-top:0.5px solid var(--hair);font-size:11px;color:var(--mute)}

@media(max-width:600px){
  .site-header{padding:0 16px}
  .wrap{padding:0 16px 64px}
  .detail-kpis{margin-left:0}
  td,th{padding:8px 10px}
}
</style>
</head>
<body>

<header class="site-header">
  <a class="header-logo" href="home.html">
    <img src="logo_bolapresa.jpg" alt="Bola Presa" onerror="this.style.display='none'" />
    Bola Presa
  </a>
  <div class="header-divider"></div>
  <span class="header-section">Salários</span>
  <span class="header-badge">2025–26</span>
  <nav class="site-nav">
    <a class="nav-lnk" href="home.html">Início</a>
    <a class="nav-lnk" href="index.html">Times</a>
    <a class="nav-lnk" href="players.html">Jogadores</a>
    <a class="nav-lnk" href="salaries.html">Salários</a>
  </nav>
</header>

<div id="view-teams">
  <div class="wrap">
    <div class="hero">
      <h1>Salários <em>2025–26</em></h1>
      <p>Contratos, valores garantidos, tipo de assinatura e espaço no cap de todos os 30 times.</p>
      <div class="hero-meta">
        <span class="meta-pill blue">⬤ Temporada 2025–26</span>
        <span class="meta-pill">Fonte: Ball Don't Lie</span>
        <span class="meta-pill">Salary Cap: $140,6M</span>
        <span class="meta-pill">Luxury Tax: $170,8M</span>
      </div>
    </div>
    <div class="controls">
      <div class="search-wrap">
        <svg width="14" height="14" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="9" r="6"/><path d="M15 15l4 4"/></svg>
        <input class="search-input" id="search-teams" type="text" placeholder="Buscar time..." autocomplete="off" />
      </div>
      <div class="filter-group" id="conf-filters">
        <button class="filter-btn active" data-conf="ALL">Todos</button>
        <button class="filter-btn" data-conf="East">Leste</button>
        <button class="filter-btn" data-conf="West">Oeste</button>
      </div>
      <select class="sort-select" id="sort-teams">
        <option value="cap_desc">Maior cap hit</option>
        <option value="cap_asc">Menor cap hit</option>
        <option value="name_asc">Nome A–Z</option>
        <option value="count_desc">Mais jogadores</option>
      </select>
    </div>
    <div id="teams-grid" class="teams-grid">
      <div class="loading" style="grid-column:1/-1">
        <div class="loading-dots"><div class="ld"></div><div class="ld"></div><div class="ld"></div></div>
        <div>Carregando dados…</div>
      </div>
    </div>
  </div>
</div>

<div id="view-detail">
  <div class="wrap">
    <button class="back-btn" id="btn-back">
      <svg width="14" height="14" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M13 4l-7 7 7 7"/></svg>
      Todos os times
    </button>
    <div id="detail-content"></div>
  </div>
</div>

<script>
// BDL team_id (1-30) → NBA official team_id (para logos do CDN da NBA)
const BDL_TO_NBA_TEAM = {
  1:1610612737, 2:1610612738, 3:1610612751, 4:1610612766, 5:1610612741,
  6:1610612739, 7:1610612742, 8:1610612743, 9:1610612765, 10:1610612744,
  11:1610612745,12:1610612754,13:1610612746,14:1610612747,15:1610612763,
  16:1610612748,17:1610612749,18:1610612750,19:1610612740,20:1610612752,
  21:1610612760,22:1610612753,23:1610612755,24:1610612756,25:1610612757,
  26:1610612758,27:1610612759,28:1610612761,29:1610612762,30:1610612764
};

// nome do jogador → NBA official player_id (carregado do nba_player_ids.json)
var NBA_PLAYER_IDS = {};

function logoUrl(bdlTeamId) {
  var nbaId = BDL_TO_NBA_TEAM[bdlTeamId];
  return nbaId ? 'https://cdn.nba.com/logos/nba/' + nbaId + '/global/L/logo.svg' : '';
}
function normalizeStr(s) {
  // Remove acentos para comparação — ex: Dončić → Doncic
  return (s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '');
}
function photoUrl(playerName) {
  var nbaId = NBA_PLAYER_IDS[playerName] || NBA_PLAYER_IDS[normalizeStr(playerName)];
  return nbaId ? 'https://cdn.nba.com/headshots/nba/latest/260x190/' + nbaId + '.png' : '';
}

const CAP_LIMIT = 140588000;
const LUX_TAX   = 170814000;

var allTeams   = [];
var activeConf = 'ALL';
var activeSort = 'cap_desc';
var searchQ    = '';

function fmt(n) {
  if (n == null || n === 0) return '—';
  if (n >= 1e6) return '$' + (n/1e6).toFixed(1) + 'M';
  if (n >= 1e3) return '$' + (n/1e3).toFixed(0) + 'K';
  return '$' + n;
}

function badgeClass(type) {
  var t = (type || '').toLowerCase();
  if (t.includes('rookie'))   return 'badge-rookie';
  if (t.includes('livre') || t.includes('free')) return 'badge-free';
  if (t.includes('exten'))    return 'badge-extension';
  if (t.includes('mínimo') || t.includes('minimum')) return 'badge-minimum';
  if (t.includes('two-way') || t.includes('two_way')) return 'badge-twoway';
  return 'badge-other';
}

async function loadIndex() {
  try {
    // Carrega mapa nome → NBA player_id para fotos
    try {
      var rp = await fetch('data/salaries/nba_player_ids.json');
      if (rp.ok) NBA_PLAYER_IDS = await rp.json();
    } catch(e) { /* sem fotos, sem problema */ }

    var r = await fetch('data/salaries/salaries_index.json');
    if (!r.ok) throw new Error(r.statusText);
    allTeams = await r.json();
    renderGrid();
  } catch(e) {
    document.getElementById('teams-grid').innerHTML =
      '<div class="empty" style="grid-column:1/-1">Dados não encontrados.<br>Execute <code>python3 generate_salaries.py</code> primeiro.</div>';
  }
}

async function loadTeam(abbr) {
  var r = await fetch('data/salaries/salaries_' + abbr.toLowerCase() + '.json');
  if (!r.ok) return null;
  return r.json();
}

function renderGrid() {
  var teams = allTeams.slice();
  if (activeConf !== 'ALL') teams = teams.filter(function(t){ return t.conference === activeConf; });
  if (searchQ) {
    var q = searchQ.toLowerCase();
    teams = teams.filter(function(t){ return t.full_name.toLowerCase().includes(q); });
  }
  if (activeSort === 'cap_asc')    teams.sort(function(a,b){ return (a.total_cap_raw||0)-(b.total_cap_raw||0); });
  else if (activeSort === 'name_asc')   teams.sort(function(a,b){ return a.full_name.localeCompare(b.full_name,'pt'); });
  else if (activeSort === 'count_desc') teams.sort(function(a,b){ return (b.player_count||0)-(a.player_count||0); });
  else teams.sort(function(a,b){ return (b.total_cap_raw||0)-(a.total_cap_raw||0); });

  var grid = document.getElementById('teams-grid');
  if (!teams.length) {
    grid.innerHTML = '<div class="empty" style="grid-column:1/-1">Nenhum time encontrado.</div>';
    return;
  }

  grid.innerHTML = teams.map(function(t) {
    var pct  = Math.min(100, Math.round(((t.total_cap_raw||0)/LUX_TAX)*100));
    var over = (t.total_cap_raw||0) > LUX_TAX;
    var conf = t.conference === 'East' ? 'Conferência Leste' : 'Conferência Oeste';
    var logo = logoUrl(t.team_id);
    return '<div class="team-card" onclick="openTeam(\'' + t.abbreviation + '\',' + t.team_id + ')">' +
      '<div class="team-card-top">' +
        (logo ? '<img class="team-logo" src="' + logo + '" alt="' + t.full_name + '" onerror="this.style.opacity=.15" />' : '<div class="team-logo"></div>') +
        '<div>' +
          '<div class="team-card-name">' + t.full_name + '</div>' +
          '<div class="team-card-conf">' + conf + '</div>' +
        '</div>' +
      '</div>' +
      '<div class="team-stats-row">' +
        '<div class="ts-cell"><div class="ts-label">Total cap</div><div class="ts-value ' + (over?'red':'blue') + '">' + t.total_cap + '</div></div>' +
        '<div class="ts-cell"><div class="ts-label">Jogadores</div><div class="ts-value">' + t.player_count + '</div></div>' +
      '</div>' +
      '<div class="cap-bar-wrap">' +
        '<div class="cap-bar-labels"><span>Luxury tax</span><span>' + pct + '%</span></div>' +
        '<div class="cap-bar"><div class="cap-bar-fill ' + (over?'over':'') + '" style="width:' + Math.min(pct,100) + '%"></div></div>' +
      '</div>' +
    '</div>';
  }).join('');
}

async function openTeam(abbr, teamId) {
  document.getElementById('view-teams').style.display = 'none';
  var vd = document.getElementById('view-detail');
  vd.style.display = 'block';
  vd.classList.remove('visible');
  document.getElementById('detail-content').innerHTML =
    '<div class="loading"><div class="loading-dots"><div class="ld"></div><div class="ld"></div><div class="ld"></div></div><div>Carregando…</div></div>';
  window.scrollTo({top:0});

  var data = await loadTeam(abbr);
  if (!data) {
    document.getElementById('detail-content').innerHTML = '<div class="empty">Erro ao carregar dados do time.</div>';
    return;
  }
  renderDetail(data);
  setTimeout(function(){ vd.classList.add('visible'); }, 10);
}

function renderDetail(data) {
  var team = data.team, players = data.players;
  var total_cap = data.total_cap, total_cap_raw = data.total_cap_raw, player_count = data.player_count, season = data.season;
  var over = total_cap_raw > LUX_TAX;
  var confTxt = team.conference === 'East' ? 'Leste' : 'Oeste';
  var seasonLabel = season + '–' + String(season+1).slice(2);
  var logo = logoUrl(team.id);

  var rows = players.map(function(p, i) {
    var isTop = i < 3;
    var dur = (p.start_year && p.end_year) ? p.start_year + '–' + p.end_year : '—';
    var yrs = p.contract_years ? '(' + p.contract_years + ' ano' + (p.contract_years>1?'s':'') + ')' : '';
    var faHtml = '—';
    if (p.free_agent_year) {
      var cls = (p.free_agent_status||'').includes('UFA') ? 'fa-ufa' : 'fa-rfa';
      faHtml = '<span class="' + cls + '">' + p.free_agent_status + '</span>&thinsp;' + p.free_agent_year;
    }
    var photo = photoUrl(p.name);
    var photoHtml = photo
      ? '<img class="player-photo" src="' + photo + '" alt="' + p.name + '" onerror="this.style.opacity=0" />'
      : '<div class="player-photo" style="display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--mute-2)">' + (p.name||'').charAt(0) + '</div>';

    return '<tr>' +
      '<td><span class="jersey-num">' + (p.jersey_number ? '#'+p.jersey_number : '') + '</span></td>' +
      '<td><div class="player-cell">' +
        photoHtml +
        '<div><div class="player-name">' + p.name + '</div><div class="player-pos">' + (p.position||'') + '</div></div>' +
      '</div></td>' +
      '<td class="r"><span class="sal-val ' + (isTop?'top':'') + '">' + p.cap_hit + '</span></td>' +
      '<td><span class="badge ' + badgeClass(p.contract_type) + '">' + (p.contract_type||'—') + '</span></td>' +
      '<td><span class="signed-text">' + (p.signed_using||'—') + '</span></td>' +
      '<td><span class="sal-val dim">' + dur + ' ' + yrs + '</span></td>' +
      '<td class="r"><span class="sal-val dim">' + p.total_value + '</span></td>' +
      '<td class="r"><span class="sal-val dim">' + p.total_guaranteed + '</span></td>' +
      '<td>' + faHtml + '</td>' +
    '</tr>';
  }).join('');

  document.getElementById('detail-content').innerHTML =
    '<div class="detail-hero">' +
      (logo ? '<img class="detail-logo" src="' + logo + '" alt="' + team.full_name + '" onerror="this.style.opacity=.15" />' : '') +
      '<div>' +
        '<div class="detail-team-name">' + team.full_name + '</div>' +
        '<div class="detail-sub">' + confTxt + ' &middot; ' + team.division + ' Division &middot; Temporada ' + seasonLabel + '</div>' +
      '</div>' +
      '<div class="detail-kpis">' +
        '<div><div class="kpi-label">Total cap</div><div class="kpi-value ' + (over?'red':'') + '">' + total_cap + '</div></div>' +
        '<div><div class="kpi-label">Jogadores</div><div class="kpi-value neutral">' + player_count + '</div></div>' +
        '<div><div class="kpi-label">Luxury tax</div><div class="kpi-value neutral" style="font-size:14px">' + fmt(LUX_TAX) + '</div></div>' +
      '</div>' +
    '</div>' +
    '<div style="margin-bottom:32px">' +
      '<div class="sec-head"><div class="sec-line"></div><span class="sec-name">Contratos · ordenados por cap hit</span></div>' +
      '<div class="tbl-wrap">' +
        '<table>' +
          '<thead><tr>' +
            '<th style="width:28px"></th>' +
            '<th>Jogador</th>' +
            '<th class="r">Cap Hit</th>' +
            '<th>Tipo</th>' +
            '<th>Como foi assinado</th>' +
            '<th>Duração</th>' +
            '<th class="r">Valor total</th>' +
            '<th class="r">Garantido</th>' +
            '<th>Ag. livre</th>' +
          '</tr></thead>' +
          '<tbody>' +
            rows +
            '<tr class="totals-row">' +
              '<td colspan="2">TOTAL — ' + player_count + ' jogadores</td>' +
              '<td class="r total-cap">' + total_cap + '</td>' +
              '<td colspan="6"></td>' +
            '</tr>' +
          '</tbody>' +
        '</table>' +
      '</div>' +
      '<div class="cap-legend">' +
        '<span><div class="dot" style="background:var(--bp-blue)"></div>Salary cap ' + fmt(CAP_LIMIT) + '</span>' +
        '<span><div class="dot" style="background:var(--red)"></div>Luxury tax ' + fmt(LUX_TAX) + '</span>' +
        (over ? '<span style="color:var(--red)">⚠ Time acima do luxury tax</span>' : '') +
      '</div>' +
    '</div>' +
    '<div class="footer-note">Dados: Ball Don\'t Lie · NBA 2025–26 · bolapresa.com.br</div>';
}

function closeTeam() {
  document.getElementById('view-detail').style.display = 'none';
  document.getElementById('view-teams').style.display = 'block';
  window.scrollTo({top:0});
}

document.getElementById('btn-back').addEventListener('click', closeTeam);
document.getElementById('search-teams').addEventListener('input', function(e) {
  searchQ = e.target.value.trim();
  renderGrid();
});
document.getElementById('conf-filters').addEventListener('click', function(e) {
  var btn = e.target.closest('[data-conf]');
  if (!btn) return;
  document.querySelectorAll('[data-conf]').forEach(function(b){ b.classList.remove('active'); });
  btn.classList.add('active');
  activeConf = btn.dataset.conf;
  renderGrid();
});
document.getElementById('sort-teams').addEventListener('change', function(e) {
  activeSort = e.target.value;
  renderGrid();
});

loadIndex();
</script>
</body>
</html>
