<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/jpeg" href="logo_bolapresa.jpg">
<title>Ficha do Jogo · Bola Presa</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue',sans-serif;background:#fff;color:#1d1d1f}
.wrap{padding:2rem 2rem 3rem;max-width:960px;margin:0 auto}
.site-header{display:flex;align-items:center;gap:10px;margin-bottom:1.5rem}
.site-name{font-size:18px;font-weight:600;letter-spacing:-0.3px}
.bp-brand{display:flex;align-items:center;gap:6px;margin-left:auto}
.bp-logo{width:22px;height:22px;border-radius:4px;object-fit:cover}
.bp-text{font-size:12px;color:#86868b}
.site-nav{display:flex;align-items:center;gap:4px;margin-left:10px}
.nav-lnk{font-size:13px;color:#86868b;text-decoration:none;padding:4px 10px;border-radius:6px}
.nav-lnk:hover{background:#f5f5f7;color:#1d1d1f}
.scoreboard{display:flex;align-items:center;justify-content:center;gap:20px;padding:1.5rem 0;border-bottom:0.5px solid #e5e5ea;margin-bottom:1.5rem}
.sb-team{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:100px}
.sb-logo{width:56px;height:56px;object-fit:contain}
.sb-name{font-size:13px;font-weight:500;color:#1d1d1f;text-align:center}
.sb-score{font-family:ui-monospace,monospace;font-size:42px;font-weight:700;letter-spacing:-2px;color:#1d1d1f}
.sb-score.winner{color:#1D9E75}
.sb-sep{display:flex;flex-direction:column;align-items:center;gap:4px}
.sb-dash{font-size:28px;color:#e5e5ea;font-weight:300}
.sb-date{font-size:12px;color:#86868b}
.sec-head{display:flex;align-items:center;gap:8px;margin:1.75rem 0 0.75rem}
.sec-line{width:3px;height:14px;border-radius:2px;flex-shrink:0}
.sec-name{font-size:13px;font-weight:500;color:#1d1d1f}
.chart-wrap{position:relative;height:200px;margin-top:8px}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:#f9f9f9;border-radius:10px;padding:14px 16px}
.card-title{font-size:11px;color:#86868b;font-weight:500;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:10px}
.box-wrap{overflow-x:auto}
.box-table{width:100%;border-collapse:collapse;font-size:12px}
.box-table th{padding:5px 6px;border-bottom:0.5px solid #d2d2d7;color:#86868b;font-weight:500;text-align:right;font-size:11px;white-space:nowrap}
.box-table th:first-child{text-align:left}
.box-table td{padding:7px 6px;border-bottom:0.5px solid #e5e5ea;text-align:right;font-family:ui-monospace,monospace;font-size:12px;white-space:nowrap}
.box-table td:first-child{text-align:left;font-family:inherit;font-weight:500}
.box-table tr:last-child td{border-bottom:none}
.pm-pos{color:#1D9E75}.pm-neg{color:#D85A30}
.bench-row td:first-child{color:#86868b}
.box-team-label{font-size:11px;font-weight:500;color:#86868b;letter-spacing:0.05em;text-transform:uppercase;margin:1rem 0 0.4rem;display:flex;align-items:center;gap:6px}
.ff-section{background:#f9f9f9;border-radius:10px;padding:14px 16px}
.ff-section-title{font-size:11px;color:#86868b;margin-bottom:10px;font-weight:500;text-transform:uppercase;letter-spacing:0.05em}
.ff-row{display:grid;grid-template-columns:1fr 28px 1fr;gap:4px;align-items:center;padding:6px 0;border-bottom:0.5px solid #e5e5ea}
.ff-row:last-child{border-bottom:none}
.ff-team-cell{display:flex;align-items:center;gap:5px}
.ff-team-cell.right{flex-direction:row-reverse}
.ff-bar-track{height:3px;background:#e5e5ea;border-radius:2px;overflow:hidden;width:36px;flex-shrink:0}
.ff-bar-fill{height:100%;border-radius:2px}
.ff-num{font-family:ui-monospace,monospace;font-size:12px;font-weight:500;flex-shrink:0}
.ff-diff{font-size:10px;font-weight:600;flex-shrink:0}
.stat-cmp-row{display:flex;align-items:center;padding:7px 0;border-bottom:0.5px solid #e5e5ea}
.stat-cmp-row:last-child{border-bottom:none}
.stat-cmp-label{font-size:12px;color:#6e6e73;flex:1;text-align:center;padding:0 6px}
.stat-cmp-val{font-family:ui-monospace,monospace;font-size:14px;font-weight:600;width:52px;text-align:center}
.zone-row{display:grid;grid-template-columns:1fr 100px 1fr;gap:4px;align-items:center;padding:7px 0;border-bottom:0.5px solid #e5e5ea}
.zone-row:last-child{border-bottom:none}
.zone-cell{display:flex;align-items:center;gap:6px}
.zone-cell.right{flex-direction:row-reverse}
.zone-score{font-family:ui-monospace,monospace;font-weight:600;font-size:13px}
.zone-pct{font-family:ui-monospace,monospace;font-size:11px;color:#86868b}
.zone-label{font-size:10px;color:#86868b;text-align:center;line-height:1.3}
.matchup-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:0.5px solid #e5e5ea}
.matchup-row:last-child{border-bottom:none}
.matchup-photo{width:36px;height:36px;border-radius:50%;object-fit:cover;background:#e5e5ea;flex-shrink:0}
.matchup-info{flex:1;min-width:0}
.matchup-names-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:3px}
.matchup-player{font-size:13px;font-weight:500;color:#1d1d1f}
.matchup-team-badge{font-size:10px;font-weight:600}
.matchup-detail{font-size:11px;color:#86868b}
.matchup-result{display:flex;gap:14px;flex-shrink:0;text-align:right}
.matchup-stat-block{font-size:11px;color:#86868b}
.matchup-stat-block span{font-family:ui-monospace,monospace;font-size:13px;font-weight:600;color:#1d1d1f;display:block}
.run-card{border-radius:10px;padding:12px 14px;border:0.5px solid #e5e5ea;background:#f9f9f9}
.run-score{font-family:ui-monospace,monospace;font-size:22px;font-weight:700;letter-spacing:-0.5px}
.run-label{font-size:11px;color:#86868b;margin-top:2px}
.consec-row{display:flex;align-items:center;padding:8px 0;margin-top:8px;border-top:0.5px solid #e5e5ea}
.footer-note{margin-top:2.5rem;padding-top:1rem;border-top:0.5px solid #e5e5ea;font-size:11px;color:#86868b}
.loading{text-align:center;padding:3rem;color:#86868b;font-size:14px}
</style>
</head>
<body>
<div class="wrap">
  <div class="site-header">
    <span class="site-name">Ficha do Jogo</span>
    <div class="bp-brand">
      <img class="bp-logo" src="logo_bolapresa.jpg" alt="Bola Presa">
      <span class="bp-text">Bola Presa</span>
    </div>
    <div class="site-nav">
      <a class="nav-lnk" href="home.html">Início</a>
      <a class="nav-lnk" href="playoffs.html">Playoffs</a>
      <a class="nav-lnk" href="index.html">Times</a>
    </div>
  </div>
  <div id="content"><div class="loading">Carregando dados do jogo...</div></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
const TID={ATL:1610612737,BOS:1610612738,BKN:1610612751,CHA:1610612766,CHI:1610612741,CLE:1610612739,DAL:1610612742,DEN:1610612743,DET:1610612765,GSW:1610612744,HOU:1610612745,IND:1610612754,LAC:1610612746,LAL:1610612747,MEM:1610612763,MIA:1610612748,MIL:1610612749,MIN:1610612750,NOP:1610612740,NYK:1610612752,OKC:1610612760,ORL:1610612753,PHI:1610612755,PHX:1610612756,POR:1610612757,SAC:1610612758,SAS:1610612759,TOR:1610612761,UTA:1610612762,WAS:1610612764};
const TC={ATL:"#E03A3E",BOS:"#007A33",BKN:"#000000",CHA:"#1D1160",CHI:"#CE1141",CLE:"#860038",DAL:"#00538C",DEN:"#FEC524",DET:"#C8102E",GSW:"#1D428A",HOU:"#CE1141",IND:"#002D62",LAC:"#C8102E",LAL:"#552583",MEM:"#5D76A9",MIA:"#98002E",MIL:"#00471B",MIN:"#78BE20",NOP:"#0C2340",NYK:"#F58426",OKC:"#007AC1",ORL:"#0077C0",PHI:"#006BB6",PHX:"#E56020",POR:"#E03A3E",SAC:"#5A2D81",SAS:"#8A8D8F",TOR:"#CE1141",UTA:"#002B5C",WAS:"#002B5C"};
const TNAME={ATL:"Atlanta Hawks",BOS:"Boston Celtics",BKN:"Brooklyn Nets",CHA:"Charlotte Hornets",CHI:"Chicago Bulls",CLE:"Cleveland Cavaliers",DAL:"Dallas Mavericks",DEN:"Denver Nuggets",DET:"Detroit Pistons",GSW:"Golden State Warriors",HOU:"Houston Rockets",IND:"Indiana Pacers",LAC:"Los Angeles Clippers",LAL:"Los Angeles Lakers",MEM:"Memphis Grizzlies",MIA:"Miami Heat",MIL:"Milwaukee Bucks",MIN:"Minnesota Timberwolves",NOP:"New Orleans Pelicans",NYK:"New York Knicks",OKC:"Oklahoma City Thunder",ORL:"Orlando Magic",PHI:"Philadelphia 76ers",PHX:"Phoenix Suns",POR:"Portland Trail Blazers",SAC:"Sacramento Kings",SAS:"San Antonio Spurs",TOR:"Toronto Raptors",UTA:"Utah Jazz",WAS:"Washington Wizards"};

function logoUrl(a){return "https://cdn.nba.com/logos/nba/"+TID[a]+"/global/L/logo.svg";}
function photoUrl(pid){return "https://cdn.nba.com/headshots/nba/latest/260x190/"+pid+".png";}

var params=new URLSearchParams(window.location.search);
var gameId=params.get('id');
if(!gameId){
  document.getElementById('content').innerHTML='<div class="loading">Nenhum jogo especificado.</div>';
}else{
  Promise.all([
    fetch("jogo_"+gameId+".json").then(function(r){return r.json();}),
    fetch("times_full.json").then(function(r){return r.json();}).then(function(d){return d.teams||{};}),
  ]).then(function(results){render(results[0],results[1]);})
  .catch(function(e){document.getElementById('content').innerHTML='<div class="loading">Erro: '+e.message+'</div>';});
}

function fmtDate(d){
  var dt=new Date(d+'T12:00:00');
  return dt.toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long',year:'numeric'});
}

function minToClock(m){
  if(m<0) m=0;
  if(m<=48){
    var q=Math.min(4,Math.floor(m/12)+1);
    var elapsed=m-(q-1)*12;
    var remaining=Math.max(0,12-elapsed);
    var mins=Math.floor(remaining);
    var secs=Math.round((remaining-mins)*60);
    return mins+":"+(secs<10?"0":"")+secs+" "+q+"Q";
  }else{
    var ot=Math.floor((m-48)/5)+1;
    var elapsed2=(m-48)-(ot-1)*5;
    var remaining2=Math.max(0,5-elapsed2);
    var mins2=Math.floor(remaining2);
    var secs2=Math.round((remaining2-mins2)*60);
    return mins2+":"+(secs2<10?"0":"")+secs2+" OT"+(ot>1?ot:"");
  }
}

function periodLabel(i){
  if(i<4) return (i+1)+"Q";
  if(i===4) return "OT";
  return "OT"+(i-3);
}

function render(game,teams){
  var home=game.home, away=game.away, home_pts=game.home_pts, away_pts=game.away_pts, date=game.date;
  var four_factors=game.four_factors||{}, misc=game.misc||{}, hustle=game.hustle||{};
  var box_score=game.box_score||{}, score_timeline=game.score_timeline||[];
  var shot_zones=game.shot_zones||{}, matchups=game.matchups||[], game_flow=game.game_flow||{};

  var homeWon=home_pts>away_pts;
  var c1=TC[home]||'#888';
  var c2=TC[away]||'#888';
  var td1=teams[home]||{};
  var td2=teams[away]||{};
  var gf=game_flow;
  var m1=misc[home]||{};
  var m2=misc[away]||{};
  var h1=hustle[home]||{};
  var h2=hustle[away]||{};
  var sz1=shot_zones[home]||{};
  var sz2=shot_zones[away]||{};

  var qs_home=gf.quarter_scores?gf.quarter_scores[home]:[0,0,0,0];
  var qs_away=gf.quarter_scores?gf.quarter_scores[away]:[0,0,0,0];
  if(!qs_home||qs_home.length===0) qs_home=[0,0,0,0];
  if(!qs_away||qs_away.length===0) qs_away=[0,0,0,0];

  // Conta sets — apenas quartos regulares (índices 0-3)
  var sets_home=0, sets_away=0;
  for(var si=0;si<4&&si<qs_home.length;si++){
    if(qs_home[si]>qs_away[si]) sets_home++;
    else if(qs_away[si]>qs_home[si]) sets_away++;
  }

  // Timeline
  var timeline=[];
  var seen={};
  for(var ti=0;ti<score_timeline.length;ti++){
    var e=score_timeline[ti];
    var m=Math.floor(e.min);
    if(!seen[m]){seen[m]=true;timeline.push(e);}
  }
  if(score_timeline.length>0) timeline.push(score_timeline[score_timeline.length-1]);
  var chartLabels=timeline.map(function(e){return minToClock(e.min);});

  // Box score
  var POS_ORDER={'G':0,'F':1,'C':2};
  function parseMins(str){
    if(!str) return 0;
    var parts=str.split(':');
    return parseInt(parts[0]||0)*60+parseInt(parts[1]||0);
  }
  function posOrder(p){
    if(!p.starter) return 99;
    return POS_ORDER[p.pos]!==undefined?POS_ORDER[p.pos]:1;
  }
  function boxTable(abbr){
    var color=abbr===home?c1:c2;
    var players=(box_score[abbr]||[]).slice().sort(function(a,b){
      if(a.starter&&!b.starter) return -1;
      if(!a.starter&&b.starter) return 1;
      if(a.starter&&b.starter){
        var po=posOrder(a)-posOrder(b);
        if(po!==0) return po;
        if(a.pos==='G') return b.ast-a.ast;
        if(a.pos==='F') return a.reb-b.reb;
        return 0;
      }
      return parseMins(b.minutes)-parseMins(a.minutes);
    });
    var rows='';
    for(var pi=0;pi<players.length;pi++){
      var p=players[pi];
      var fgPct=p.fga>0?Math.round(p.fgm/p.fga*100):0;
      var fg3Pct=p.fg3a>0?Math.round(p.fg3m/p.fg3a*100):0;
      var pmClass=p.plus_minus>0?'pm-pos':p.plus_minus<0?'pm-neg':'';
      var pmStr=(p.plus_minus>0?'+':'')+p.plus_minus;
      rows+='<tr class="'+(p.starter?'':'bench-row')+'">'+
        '<td>'+p.name+(p.starter&&p.pos?' <span style="font-size:10px;color:#86868b;font-weight:500;letter-spacing:0.03em">'+p.pos+'</span>':'')+'</td>'+
        '<td>'+p.minutes+'</td>'+
        '<td style="font-weight:600">'+p.pts+'</td>'+
        '<td>'+p.reb+'</td><td>'+(p.oreb||0)+'</td><td>'+p.ast+'</td>'+
        '<td>'+p.stl+'/'+p.blk+'</td>'+
        '<td>'+p.fgm+'/'+p.fga+' <span style="color:#86868b;font-size:10px">'+fgPct+'%</span></td>'+
        '<td>'+p.fg3m+'/'+p.fg3a+' <span style="color:#86868b;font-size:10px">'+fg3Pct+'%</span></td>'+
        '<td>'+p.ftm+'/'+p.fta+'</td>'+
        '<td>'+p.tov+'</td>'+
        '<td class="'+pmClass+'">'+pmStr+'</td>'+
      '</tr>';
    }
    // Totais
    var tot_pts=players.reduce(function(s,p){return s+p.pts;},0);
    var tot_reb=players.reduce(function(s,p){return s+p.reb;},0);
    var tot_ast=players.reduce(function(s,p){return s+p.ast;},0);
    var tot_stl=players.reduce(function(s,p){return s+p.stl;},0);
    var tot_blk=players.reduce(function(s,p){return s+p.blk;},0);
    var tot_fgm=players.reduce(function(s,p){return s+p.fgm;},0);
    var tot_fga=players.reduce(function(s,p){return s+p.fga;},0);
    var tot_fg3m=players.reduce(function(s,p){return s+p.fg3m;},0);
    var tot_fg3a=players.reduce(function(s,p){return s+p.fg3a;},0);
    var tot_ftm=players.reduce(function(s,p){return s+p.ftm;},0);
    var tot_fta=players.reduce(function(s,p){return s+p.fta;},0);
    var tot_tov=players.reduce(function(s,p){return s+p.tov;},0);
    rows+='<tr style="border-top:1px solid #d2d2d7">'+
      '<td style="font-weight:600;color:'+color+'">Total</td>'+
      '<td></td>'+
      '<td style="font-weight:700">'+tot_pts+'</td>'+
      '<td>'+tot_reb+'</td><td>'+players.reduce(function(s,p){return s+(p.oreb||0);},0)+'</td><td>'+tot_ast+'</td>'+
      '<td>'+tot_stl+'/'+tot_blk+'</td>'+
      '<td>'+tot_fgm+'/'+tot_fga+'</td>'+
      '<td>'+tot_fg3m+'/'+tot_fg3a+'</td>'+
      '<td>'+tot_ftm+'/'+tot_fta+'</td>'+
      '<td>'+tot_tov+'</td>'+
      '<td></td>'+
    '</tr>';
    return '<div class="box-team-label">'+
      '<img src="'+logoUrl(abbr)+'" style="width:16px;height:16px;object-fit:contain">'+
      '<span style="color:'+color+'">'+TNAME[abbr]+'</span>'+
    '</div>'+
    '<div class="box-wrap"><table class="box-table">'+
      '<thead><tr>'+
        '<th style="text-align:left">Jogador</th>'+
        '<th>Min</th><th>Pts</th><th>Reb</th><th>OR</th><th>Ast</th>'+
        '<th>Stl/Blk</th><th>FG</th><th>3P</th><th>FT</th><th>TOV</th><th>+/-</th>'+
      '</tr></thead>'+
      '<tbody>'+rows+'</tbody>'+
    '</table></div>';
  }

  // Four Factors
  function ffSection(label,rows){
    var html='<div class="ff-section">'+
      '<div class="ff-section-title">'+label+'</div>'+
      '<div style="display:grid;grid-template-columns:1fr 28px 1fr;gap:4px;padding:4px 0 8px;border-bottom:0.5px solid #d2d2d7">'+
        '<span style="font-size:11px;font-weight:600;color:'+c1+'">'+home+'</span>'+
        '<span></span>'+
        '<span style="font-size:11px;font-weight:600;color:'+c2+';text-align:right">'+away+'</span>'+
      '</div>';
    for(var ri=0;ri<rows.length;ri++){
      var r=rows[ri];
      var v1=r.v1||0, v2=r.v2||0;
      var hi=r.hi;
      var maxV=Math.max(v1,v2)||1;
      var pct1=Math.round(v1/maxV*90), pct2=Math.round(v2/maxV*90);
      var unit=r.unit!=null?r.unit:'%';
      var hw=hi?(v1>v2):(v1<v2), aw=hi?(v2>v1):(v2<v1);
      var arrow=hw?'&#8592;':aw?'&#8594;':'&#183;';
      var arrowColor=hw?c1:aw?c2:'#86868b';
      var diff1='', diff2='';
      if(r.avg1!=null){
        var d1v=v1-r.avg1;
        var good1=hi?(d1v>=0):(d1v<=0);
        diff1='<span class="ff-diff" style="color:'+(good1?'#1D9E75':'#D85A30')+'">'+(d1v>0?'+':'')+d1v.toFixed(1)+'</span>';
      }
      if(r.avg2!=null){
        var d2v=v2-r.avg2;
        var good2=hi?(d2v>=0):(d2v<=0);
        diff2='<span class="ff-diff" style="color:'+(good2?'#1D9E75':'#D85A30')+'">'+(d2v>0?'+':'')+d2v.toFixed(1)+'</span>';
      }
      html+='<div class="ff-row">'+
        '<div class="ff-team-cell">'+
          '<div class="ff-bar-track"><div class="ff-bar-fill" style="width:'+pct1+'%;background:'+c1+'"></div></div>'+
          '<span class="ff-num" style="color:'+c1+'">'+v1+unit+'</span>'+diff1+
        '</div>'+
        '<div style="text-align:center">'+
          '<div style="font-size:14px;color:'+arrowColor+'">'+arrow+'</div>'+
          '<div style="font-size:9px;color:#86868b;margin-top:1px">'+r.label+'</div>'+
        '</div>'+
        '<div class="ff-team-cell right">'+
          '<div class="ff-bar-track"><div class="ff-bar-fill" style="width:'+pct2+'%;background:'+c2+'"></div></div>'+
          '<span class="ff-num" style="color:'+c2+'">'+v2+unit+'</span>'+diff2+
        '</div>'+
      '</div>';
    }
    html+='</div>';
    return html;
  }

  var ff1=four_factors[home]||{}, ff2=four_factors[away]||{};
  var ffOff1=td1.four_factors_off||{}, ffOff2=td2.four_factors_off||{};
  var ffDef1=td1.four_factors_def||{}, ffDef2=td2.four_factors_def||{};

  var offRows=[
    {label:"eFG%",    v1:ff1.efg,  v2:ff2.efg,  avg1:ffOff1.efg&&ffOff1.efg.value,  avg2:ffOff2.efg&&ffOff2.efg.value,  hi:true,  unit:"%"},
    {label:"TOV%",    v1:ff1.tov,  v2:ff2.tov,  avg1:ffOff1.tov&&ffOff1.tov.value,  avg2:ffOff2.tov&&ffOff2.tov.value,  hi:false, unit:"%"},
    {label:"OReb%",   v1:ff1.oreb, v2:ff2.oreb, avg1:ffOff1.oreb&&ffOff1.oreb.value, avg2:ffOff2.oreb&&ffOff2.oreb.value, hi:true,  unit:"%"},

          if(m===0||m===12||m===24||m===36||m===48) return chartLabels[i];
          return '';
        }},border:{display:false}},
        y:{grid:{color:gridCol},ticks:{color:textCol,font:{size:10}},border:{display:false}}
      }
    },
    plugins:[quarterPlugin]
  });
}
